#:schema node_modules/wrangler/config-schema.json
#
# Guardian Cloudflare backend — Workers + D1 + Durable Objects + R2
#
# REQUIRED PRODUCTION VALUES (see ../.env.example and README.md):
#   - database_id          -> create with: npm run db:migrate:local (local) / wrangler d1 create guardian-db
#   - bucket_name          -> create with: wrangler r2 bucket create guardian-evidence
#   - AUTH_SECRET (secret) -> npx wrangler secret put AUTH_SECRET
# Nothing in this file may contain fabricated ids or credentials. Replace the
# placeholders below with the real values produced by the commands above.

name = "guardian-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Public configuration only. Never place secrets (AUTH_SECRET, API tokens) here.
[vars]
ENVIRONMENT = "production"
TOKEN_ISSUER = "guardian-cloudflare"
ACCESS_TOKEN_TTL_SECONDS = "900"
REFRESH_TOKEN_TTL_SECONDS = "2592000"
# Comma separated list of browser origins allowed to call the API (CORS).
# Android clients do not send an Origin header and are always allowed.
CORS_ALLOWED_ORIGINS = ""
# Maximum evidence upload size (bytes) accepted by the R2 endpoint.
MAX_EVIDENCE_BYTES = "5242880"
# Retention for evidence objects / location shares, in days.
EVIDENCE_RETENTION_DAYS = "90"
LOCATION_RETENTION_DAYS = "30"

[[d1_databases]]
binding = "DB"
database_name = "guardian-db"
# Production value required: `npx wrangler d1 create guardian-db` prints it.
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "SAFETY_HUB"
class_name = "SafetyHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SafetyHub"]

[[r2_buckets]]
binding = "EVIDENCE"
# Production value required: `npx wrangler r2 bucket create guardian-evidence`
bucket_name = "guardian-evidence"

[triggers]
crons = ["17 3 * * *"]

[observability]
enabled = true
